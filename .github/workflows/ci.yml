name: Validate and package Grain Rot Depth Keeper
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
      - name: Check Lua syntax
        run: luac5.4 -p ue4ss/Mods/GrainRotDepthKeeper/Scripts/main.lua
      - name: Run unit tests with UE4SS mock
        run: lua5.4 tests/test_depthkeeper.lua
      - name: Package mod
        run: |
          mkdir -p out
          zip -r out/GrainRotDepthKeeper-v0.3.0.zip ue4ss/Mods/GrainRotDepthKeeper
          unzip -t out/GrainRotDepthKeeper-v0.3.0.zip
      - name: Upload installation ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GrainRotDepthKeeper-v0.3.0
          path: out/GrainRotDepthKeeper-v0.3.0.zip
          if-no-files-found: error
